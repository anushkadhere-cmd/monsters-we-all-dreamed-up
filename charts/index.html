<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mythology Creatures — Quadrant Plot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Harmattan&family=Hubballi&display=swap">
<link rel="stylesheet" href="../css/tokens.css">
<script>
  // In the article the title is a heading on the page, so the chart hides its own (?embed)
  // ...and waits on a blank screen until the article reveals it (c1Reveal, below)
  if (/[?&]embed\b/.test(location.search)) document.documentElement.classList.add('embedded', 'c1-wait');
</script>
<style>html.embedded, .embedded body { background: transparent; }  /* the article's parchment shows through */</style>
<style>.embedded h1 { display: none; }</style>
<style>
  /* Restyled to match the article (css/tokens.css): paper background, ink
     linework, the shared culture colours, Disney Heroic title, Hubballi labels.
     Data, positions, sizes and hover are as before. The page is one fixed-size
     block (980 x 880); the article scales it to fit its box. */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }

  #graph-header {
    margin: 0;
    font-family: var(--font-heading);
    font-weight: 400;
    font-size: 40px;
    line-height: 1.1;
    text-align: center;
    color: var(--ink);
  }

  #layout { display: flex; align-items: center; gap: 36px; }
  #plot-svg { display: block; overflow: visible; }

  /* labels in the article's typeface (Harmattan), sized for the scale the article
     draws the chart at (about 0.76): corners ~18px on screen, axes ~14px */
  .quadrant-label {
    font-family: "Harmattan", var(--font-body);
    font-size: 24px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    fill: var(--ink);
  }
  .axis-line { stroke: var(--ink); stroke-width: 1.2; }
  /* the reveal (article only): the two axes draw in, then the circles pop in
     from the middle outwards, then the labels and legend fade in */
  .axis-line { stroke-dasharray: 1; stroke-dashoffset: 0; transition: stroke-dashoffset 1.2s cubic-bezier(.65,0,.35,1); }
  .axis-line + .axis-line { transition-delay: .25s; }
  .c1-wait .axis-line { stroke-dashoffset: 1; transition-duration: .3s; transition-delay: 0s; }
  /* each circle: size 0 / opacity 0, then 130% / 50%, then 100% / 100% */
  .dot { transform-box: fill-box; transform-origin: center; }
  html:not(.c1-wait) .dot { animation: c1-pop .8s cubic-bezier(.33,0,.3,1) var(--d, 0s) both; }
  @keyframes c1-pop {
    0%   { transform: scale(0);   opacity: 0; }
    60%  { transform: scale(1.3); opacity: .5; }
    100% { transform: scale(1);   opacity: 1; }
  }
  .c1-wait .dot { transform: scale(0); opacity: 0; transition: transform .25s ease, opacity .25s ease; }   /* scrolled back above: gone again */
  .quadrant-label, .axis-tick-label, .neutral-label, #side-legend { transition: opacity .7s ease 1.4s; }
  .c1-wait :is(.quadrant-label, .axis-tick-label, .neutral-label, #side-legend) { opacity: 0; transition-delay: 0s; transition-duration: .2s; }
  @media (prefers-reduced-motion: reduce) {
    html:not(.c1-wait) .dot { animation: none; transition: opacity .6s ease var(--d, 0s); }
    .dot, .c1-wait .dot { transform: none; }
    .axis-line { stroke-dasharray: none; transition: opacity .6s ease; }
    .c1-wait .axis-line { opacity: 0; }
  }
  .axis-tick-label {
    font-family: "Harmattan", var(--font-body);
    font-size: 18px;
    letter-spacing: 0.04em;
    fill: var(--ink);
  }
  .neutral-label {
    font-family: "Harmattan", var(--font-body);
    font-size: 17px;
    font-style: italic;
    fill: var(--ink-soft);
  }

  .dot {
    cursor: pointer;
    stroke: var(--ink);
    stroke-width: 1.2;
    fill-opacity: 0.82;
    transition: fill-opacity 0.12s ease;
  }
  .dot:hover { fill-opacity: 1; stroke-width: 2; }

  /* legend column to the right of the plot */
  #side-legend {
    display: flex;
    flex-direction: column;
    gap: 34px;
    width: 170px;
    font-family: "Harmattan", var(--font-body);
  }
  .legend-block { display: flex; flex-direction: column; gap: 12px; }
  .side-legend-title {
    font-size: 18px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .culture-item, .size-item { display: flex; align-items: center; gap: 10px; font-size: 20px; letter-spacing: 0.04em; text-transform: uppercase; }
  .culture-swatch {
    width: 16px; height: 16px; border-radius: 50%;
    border: 1.2px solid var(--ink);
    flex-shrink: 0;
  }
  .size-swatch {
    border-radius: 50%;
    border: 1.2px solid var(--ink);
    flex-shrink: 0;
  }
  #size-row { display: flex; align-items: flex-end; gap: 12px; }

  /* hover card, styled like the article's script cards */
  #tooltip {
    position: fixed;
    display: none;
    width: 340px;
    background: var(--paper);
    color: var(--ink);
    border: 1px solid rgb(30 28 25 / 0.25);
    border-radius: 8px;
    padding: 16px 18px;
    box-shadow: 0 10px 30px rgb(30 28 25 / 0.16);
    font-size: 15px;
    line-height: 1.5;
    z-index: 1000;
    pointer-events: none;
  }
  #tooltip .tt-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  #tooltip .tt-emoji { font-size: 26px; line-height: 1; }
  #tooltip .tt-name { font-family: var(--font-display); font-size: 20px; line-height: 1.1; }
  #tooltip .tt-sub { font-size: 12px; letter-spacing: var(--caps-tracking); text-transform: uppercase; color: var(--ink-soft); }
  #tooltip .tt-source { margin-top: 8px; font-size: 13px; color: var(--ink-soft); font-style: italic; }
</style>
</head>
<body>

<h1 id="graph-header">What creatures show up, and in what?</h1>
<div id="layout">
  <svg id="plot-svg" width="760" height="760"></svg>
  <div id="side-legend">
    <div class="legend-block">
      <div class="side-legend-title">Cultures</div>
      <div id="culture-row" class="legend-block"></div>
    </div>
    <div class="legend-block">
      <div class="side-legend-title">Popularity</div>
      <div id="size-row"></div>
    </div>
  </div>
</div>

<div id="tooltip"></div>

<script src="creatures_data.js"></script>
<script>
// shared culture colours from css/tokens.css
const tokens = getComputedStyle(document.documentElement);
const cultureColor = (m) => tokens.getPropertyValue('--c-' + String(m).toLowerCase()).trim();

const svg = document.getElementById('plot-svg');
const NS = 'http://www.w3.org/2000/svg';
const lineLayer = document.createElementNS(NS, 'g');
const dotLayer = document.createElementNS(NS, 'g');
const labelLayer = document.createElementNS(NS, 'g');
svg.appendChild(lineLayer);
svg.appendChild(dotLayer);
svg.appendChild(labelLayer);

const plotX0 = 40;
const plotY0 = 40;
const plotW = 680;
const plotH = 680;
const centerX = plotX0 + plotW / 2;
const centerY = plotY0 + plotH / 2;
const maxR = Math.min(plotW, plotH) / 2 - 32;
const rMin = 6;
const rMax = 24;

function el(tag, attrs) {
  const node = document.createElementNS(NS, tag);
  for (const key in attrs) node.setAttribute(key, attrs[key]);
  return node;
}

function hashStr(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
  return h;
}

function seededRand(seed) {
  const x = Math.sin(seed) * 10000;
  return x - Math.floor(x);
}

const quadrantSign = {
  'top-left': { sx: -1, sy: -1 },
  'top-right': { sx: 1, sy: -1 },
  'bottom-left': { sx: -1, sy: 1 },
  'bottom-right': { sx: 1, sy: 1 }
};

const quadrantCorner = {
  'top-left': [plotX0, plotY0],
  'top-right': [plotX0 + plotW, plotY0],
  'bottom-left': [plotX0, plotY0 + plotH],
  'bottom-right': [plotX0 + plotW, plotY0 + plotH]
};

const mythLabelByQuadrant = {};
CREATURES_DATA.forEach(c => { mythLabelByQuadrant[c.quadrant] = c.mythLabel; });

for (const q in quadrantCorner) {
  const [cx, cy] = quadrantCorner[q];
  const { sx, sy } = quadrantSign[q];
  const tx = cx + (sx === -1 ? 12 : -12);
  const ty = cy + (sy === -1 ? 18 : -12);
  const label = el('text', {
    x: tx, y: ty,
    class: 'quadrant-label',
    'text-anchor': sx === -1 ? 'start' : 'end'
  });
  label.textContent = mythLabelByQuadrant[q];
  labelLayer.appendChild(label);
}

lineLayer.appendChild(el('line', { class: 'axis-line', pathLength: 1, x1: plotX0, y1: centerY, x2: plotX0 + plotW, y2: centerY }));
lineLayer.appendChild(el('line', { class: 'axis-line', pathLength: 1, x1: centerX, y1: plotY0, x2: centerX, y2: plotY0 + plotH }));

function axisLabel(x, y, text, anchor) {
  const label = el('text', { x, y, class: 'axis-tick-label', 'text-anchor': anchor });
  label.textContent = text;
  labelLayer.appendChild(label);
}

axisLabel(plotX0 + 4, centerY + 22, 'PROTECTOR', 'start');
axisLabel(plotX0 + plotW - 4, centerY + 22, 'PROTECTOR', 'end');
axisLabel(centerX - 8, plotY0 + 14, 'DESTROYER', 'end');
axisLabel(centerX - 8, plotY0 + plotH - 6, 'DESTROYER', 'end');
axisLabel(centerX - 8, centerY - 8, 'GUIDE', 'end');
axisLabel(centerX + 8, centerY + 22, 'TRICKSTER', 'start');

const neutralTag = el('text', { x: centerX + 8, y: centerY - 8, class: 'neutral-label' });
neutralTag.textContent = 'neutral';
labelLayer.appendChild(neutralTag);

const tooltip = document.getElementById('tooltip');

CREATURES_DATA.forEach((c) => {
  const { sx, sy } = quadrantSign[c.quadrant];
  const seed = hashStr(c.name);
  const jitterX = (seededRand(seed) - 0.5) * 26;
  const jitterY = (seededRand(seed + 1) - 0.5) * 26;

  let dx = sx * (c.helper * maxR) + jitterX;
  let dy = sy * (c.antagonist * maxR) + jitterY;
  if (sx === -1) dx = Math.min(dx, -4); else dx = Math.max(dx, 4);
  if (sy === -1) dy = Math.min(dy, -4); else dy = Math.max(dy, 4);

  const x = centerX + dx;
  const y = centerY + dy;
  const r = rMin + (c.popularity - 1) / 9 * (rMax - rMin);

  const circle = el('circle', { class: 'dot', cx: x, cy: y, r, fill: cultureColor(c.mythology) });
  // pop in from the middle outwards, after the axes have drawn
  circle.style.setProperty('--d', (2.1 + Math.hypot(dx, dy) / maxR * 1.1).toFixed(2) + 's');   // after the words, middle first

  const title = el('title', {});
  title.textContent = `${c.name} — ${c.mythLabel} · ${c.type}`;
  circle.appendChild(title);

  circle.addEventListener('mouseenter', () => showTooltip(c));
  circle.addEventListener('mousemove', positionTooltip);
  circle.addEventListener('mouseleave', hideTooltip);
  circle.addEventListener('touchstart', (event) => {
    const touch = event.touches && event.touches[0];
    if (touch) {
      showTooltip(c);
      positionTooltipCoords(touch.clientX, touch.clientY);
    }
  }, { passive: true });
  circle.addEventListener('touchend', hideTooltip);
  circle.addEventListener('touchcancel', hideTooltip);

  dotLayer.appendChild(circle);
});

function showTooltip(c) {
  tooltip.innerHTML = `
    <div class="tt-head">
      <div class="tt-emoji">${c.emoji || ''}</div>
      <div>
        <div class="tt-name">${c.name}</div>
        <div class="tt-sub">${c.mythLabel || c.mythology || ''} · ${c.type || ''}</div>
      </div>
    </div>
    <div class="tt-desc">${c.desc}</div>
    ${c.popularity !== undefined ? `<div class="tt-source">Popularity: ${c.popularity}/10 ${c.source ? '· ' + c.source : ''}</div>` : ''}
  `;
  tooltip.style.display = 'block';
}

function positionTooltip(event) {
  positionTooltipCoords(event.clientX, event.clientY);
}

function positionTooltipCoords(clientX, clientY) {
  const pad = 16;
  let left = clientX + pad;
  let top = clientY + pad;
  if (left + tooltip.offsetWidth > window.innerWidth) left = clientX - tooltip.offsetWidth - pad;
  if (top + tooltip.offsetHeight > window.innerHeight) top = Math.max(pad, clientY - tooltip.offsetHeight - pad);
  tooltip.style.left = `${left}px`;
  tooltip.style.top = `${top}px`;
}

function hideTooltip() {
  tooltip.style.display = 'none';
}

// legend: one swatch per culture, in the order the data lists them
const cultureRow = document.getElementById('culture-row');
const seenCultures = new Set();
CREATURES_DATA.forEach(c => {
  if (seenCultures.has(c.mythology)) return;
  seenCultures.add(c.mythology);
  const item = document.createElement('div');
  item.className = 'culture-item';
  item.innerHTML = `<span class="culture-swatch" style="background:${cultureColor(c.mythology)}"></span><span>${c.mythLabel}</span>`;
  cultureRow.appendChild(item);
});

// legend: bubble sizes for popularity 3, 6 and 9 (same scale as the plot)
const sizeRow = document.getElementById('size-row');
[3, 6, 9].forEach(popularity => {
  const radius = rMin + (popularity - 1) / 9 * (rMax - rMin);
  const swatch = document.createElement('span');
  swatch.className = 'size-swatch';
  swatch.style.width = `${radius * 2}px`;
  swatch.style.height = `${radius * 2}px`;
  sizeRow.appendChild(swatch);
});

// the article calls this when the pinned chart is centred on screen (true) or scrolled back above (false)
window.c1Reveal = (on) => document.documentElement.classList.toggle('c1-wait', !on);
</script>

</body>
</html>
